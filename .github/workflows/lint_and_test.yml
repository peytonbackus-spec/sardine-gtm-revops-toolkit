name: lint-and-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt ruff
      - run: ruff check shared_core gtm_engineer gtm_strategy_ops prototypes scripts tests
      - run: python scripts/generate_sample_data.py && git diff --exit-code sample_data
      - run: make demo > /dev/null
      - run: python -m pytest
